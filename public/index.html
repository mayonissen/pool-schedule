<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pool Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div class="header-left">
        <h1 id="center-name">Pool Schedule</h1>
        <p class="subtitle">
          <a href="https://www.nycgovparks.org/facilities/recreationcenters" target="_blank" rel="noopener" class="parks-link">View schedule and any notices on NYC Parks website</a>
        </p>
      </div>
      <div class="header-right">
        <select id="pool-select" aria-label="Select a pool"></select>
      </div>
    </div>
  </header>

  <div id="toolbar">
    <span id="filter-label">Showing <strong>All Events</strong></span>
    <div id="toolbar-actions">
      <button id="btn-pdf" class="btn">Save PDF</button>
      <button id="btn-ics" class="btn">Download ICS</button>
      <a href="#" id="btn-reset">Reset</a>
    </div>
  </div>

  <div id="loading">Loading schedule&hellip;</div>
  <div id="error" hidden></div>
  <div id="closed-notice" hidden>
    <p class="closed-heading">The pool at this facility is temporarily closed</p>
    <p><a id="closed-link" href="#" target="_blank" rel="noopener">See NYC Parks website for more details</a></p>
  </div>

  <div id="calendar" hidden>
    <div class="calendar-header">
      <div class="time-gutter"></div>
      <div class="day-headers" id="day-headers"></div>
    </div>
    <div class="calendar-body">
      <div class="time-column" id="time-column"></div>
      <div class="days-container" id="days-container"></div>
    </div>
  </div>

  <footer>
    <p>Data from <a href="https://www.nycgovparks.org" target="_blank" rel="noopener">NYC Parks</a>. This is an unofficial tool.</p>
  </footer>

  <script src="app.js"></script>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
